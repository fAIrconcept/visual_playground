<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#080510">
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>GLSL Layers</title>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="hud">
      <span id="fps">0 fps</span><span>drag horizontally</span>
    </div>
    <div id="cloud-controls">
      <label for="cloud-contrast">
        <span>Cloud contrast</span>
        <input id="cloud-contrast" type="range" min="0.0" max="3.0" step="0.1" value="1.7" />
        <output id="cloud-contrast-value" for="cloud-contrast">1.7</output>
      </label>
      <label for="view-pitch">
        <span>View pitch</span>
        <input id="view-pitch" type="range" min="-15" max="20" step="1" value="0" />
        <output id="view-pitch-value" for="view-pitch">0°</output>
      </label>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
